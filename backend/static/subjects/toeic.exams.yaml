    time_limit_seconds: 30
    menu:
      label: 写真描写問題
      color: "#3B82F6"
  "92":
    mode: single
    action: makeExam3
    category_range: [21, 21]
    time_limit_seconds: 30
    menu:
      label: 応答問題
      color: "#2563EB"
  "93":
    mode: single
    action: makeExam3
    category_range: [31, 31]
    time_limit_seconds: 90
    menu:
      label: 会話問題
      subtitle: 1セット（3問）想定
      color: "#1D4ED8"
  "94":
    mode: single
    action: makeExam3
    category_range: [41, 41]
    time_limit_seconds: 90
    menu:
      label: 説明文問題
      subtitle: 1セット（3問）想定
      color: "#1E40AF"
  "95":
    mode: single
    action: makeExam3
    category_range: [51, 55]
    time_limit_seconds: 45
    menu:
      label: 短文穴埋め問題
      color: "#059669"
  "96":
    mode: single
    action: makeExam3
