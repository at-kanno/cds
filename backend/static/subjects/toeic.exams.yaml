# TOEIC L&R — 試験プラン
#
# カテゴリ（knowledge_base.CATEGORY）:
#   Part1 写真描写   11
#   Part2 応答       21
#   Part3 会話       31  （セット: FLAG=先頭NUMBER, 音声 {FLAG}.mp3）
#   Part4 説明文     41  （セット: FLAG=先頭NUMBER, 音声 {FLAG}.mp3）
#   Part5 短文穴埋め 51-55（品詞/時制/前置詞/接続詞/語彙）均等
#   Part6 長文穴埋め 61  （セット予定）
#   Part7 読解       71 シングル / 72 ダブル / 73 トリプル
#
# 時間（暫定）: Listening 30秒/問, Reading 45秒/問

area_order:
  - part1
  - part2
  - part3
  - part4
  - part5
  - part6
  - part7

areas:
  part1:
    name: 写真描写問題
    abbrev: P1
    # Part1 は当面 CATEGORY 11 のみ（将来拡張の余地あり）
    categories: [11]
    practices: [写真描写問題]
    choice_count: 4
    listening: true
    max_audio_plays: 1
    # メディア: backend/image/TOEIC-1/{NUMBER}.png と {NUMBER}-A..D.mp3
    # 出題時は選択肢テキスト非表示（音声のみ）。解説では表示。
  part2:
    name: 応答問題
    abbrev: P2
    categories: [21]
    practices: [応答問題]
    choice_count: 3
    listening: true
    max_audio_plays: 1
    # メディア: backend/image/TOEIC-2/{NUMBER}-Q.mp3 と {NUMBER}-A..C.mp3
    # DB: A1-A3=応答, A4=英文の質問（解説で設問音声の横に表示）
  part3:
    name: 会話問題
    abbrev: P3
    categories: [31]
    practices: [会話問題]
    choice_count: 4
    listening: true
    max_audio_plays: 1
    # 1セット=3問。FLAG=セット先頭 NUMBER（301,304,…）。
    # 音声/図: image/TOEIC-3/{FLAG}.mp3|.png（3問とも同じ）。分野別は先頭のみ再生・2セットから5問。
    set_size: 3
    passage_group: flag
    passages: 2
    flag_min: 301
    flag_max: 399
  part4:
    name: 説明文問題
    abbrev: P4
    categories: [41]
    practices: [説明文問題]
    choice_count: 4
    listening: true
    max_audio_plays: 1
    # Part3 と同型。FLAG=セット先頭 NUMBER（401,404,…）。音声: image/TOEIC-4/{FLAG}.mp3
    set_size: 3
    passage_group: flag
    passages: 2
    flag_min: 401
    flag_max: 499
  part5:
    name: 短文穴埋め問題
    abbrev: P5
    # area コード 50 相当。出題カテゴリは 51-55
    area_code: 50
    categories: [51, 52, 53, 54, 55]
    practices: [品詞, 時制, 前置詞, 接続詞, 語彙]
    choice_count: 4
  part6:
    name: 長文穴埋め問題
    abbrev: P6
    categories: [61]
    practices: [長文穴埋め問題]
    choice_count: 4
    set_size: 4
    passage_group: flag
  part7:
    name: 読解問題
    abbrev: P7
    categories: [71, 72, 73]
    practices: [シングルパッケージ, ダブルパッケージ, トリプルパッケージ]
    choice_count: 4
    passage_group: flag

status_rules:
  mock_exam:
    min_status: 0
    completed_min_status: 999
    messages:
      locked: ""
      unlocked: 本番形式の模擬試験を受験できます。
      completed: 模擬試験を複数回受験済みです。

menu:
  title: TOEIC メニュー
  hierarchy: true
  top:
    - id: single_question
      label: 一問一答
      subtitle: Part別・1問または1セット
      action: openSubmenu
      submenu: single_question
      color: "#7C3AED"
    - id: area_quiz
      label: 分野別問題
      subtitle: Part別の確認問題
      action: openSubmenu
      submenu: area_quiz
      color: "#2563EB"
    - id: comprehensive
      label: 総合問題
      subtitle: ヒアリング / リーディング / 本番
      action: openSubmenu
      submenu: comprehensive
      color: "#059669"
  submenus:
    single_question:
      title: 一問一答
      items: [91, 92, 93, 94, 95, 96, 97]
    area_quiz:
      title: 分野別問題
      items: [10, 11, 12, 13, 14, 15, 16]
    comprehensive:
      title: 総合問題
      status_rule: mock_exam
      items: [30, 31, 32, 40, 41, 42, 60, 70]
  actions:
    - id: admin
      label: 管理画面
      action: makeExam
      category: 99
    - id: logout
      label: ログアウト
      action: logout

exams:
  # --- 一問一答（セット型は暫定でカテゴリから1問。セット単位UIは後続） ---
  "91":
    mode: single
    action: makeExam3
