      color: "#1E40AF"
    slots:
      # Part3 と同様 3+2（各ブロック先頭で音声）
      - repeat: 5
        from: [41]
  "14":
    mode: multi
    action: makeExam
    title: 短文穴埋め問題：分野別
    exam_type: 短文穴埋め(5問)
    time_limit_seconds: 225
    menu:
      label: 短文穴埋め問題
      subtitle: "5問（51-55均等）/ 約3分45秒"
      color: "#059669"
    slots:
      - equal_from: [51, 52, 53, 54, 55]
        count: 5
  "15":
    mode: multi
    action: makeExam
    title: 長文穴埋め問題：分野別
    exam_type: 長文穴埋め(5問)
    time_limit_seconds: 225
