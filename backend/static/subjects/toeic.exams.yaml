  # --- 分野別（P1/2/5/7=5問, P3/4/6=2セットから5問）---
  "10":
    mode: multi
    action: makeExam
    title: 写真描写問題：分野別
    exam_type: 写真描写(5問)
    time_limit_seconds: 150
    menu:
      label: 写真描写問題
      subtitle: "5問 / 約2分30秒"
      color: "#3B82F6"
    slots:
      - repeat: 5
