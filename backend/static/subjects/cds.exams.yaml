# ITIL4 CDS — 試験プラン（非エンジニア編集用）
# areas: 画面表示用の領域定義
# topics: 出題スロット用のカテゴリ参照

area_order:
  - org
  - tech
  - svs
  - coordination

areas:
  org:
    name: 組織と人材
    abbrev: 組織
    categories: [11, 12, 13]
    practices: [組織の文化, シフトレフト, 要員の計画と管理]
  tech:
    name: 情報と技術
    abbrev: 技術
    categories: [21]
    practices: [新たな技術]
  svs:
    name: サービスバリュー・ストリーム
    abbrev: SVS
    categories: [31, 32, 33, 34]
    practices:
      - 新サービス導入のバリューストリーム
      - 新サービス導入に貢献するプラクティス
      - ユーザサポートのバリューストリーム
      - ユーザサポートに貢献するプラクティス
  coordination:
    name: 活動の調整とリソースの調達
    abbrev: 活動調整・調達
    categories: [41, 42]
    practices: [活動の調整方法, 調達の手段]

topics:
  org_culture:
    category: 11
    label: 組織の文化
  shift_left:
    category: 12
    label: シフトレフト
  workforce_planning:
    category: 13
    label: 人材の計画と管理
  info_technology:
    category: 21
    label: 情報と技術
  svs_new_service:
    category: 31
    label: バリューストリーム（新サービスSVS）
  new_service_practice:
    category: 32
    label: 新サービス・プラクティス
  svs_user_support:
    category: 33
    label: バリューストリーム（ユーザサポート）
  user_support_practice:
    category: 34
    label: ユーザサポート・プラクティス
  activity_coordination:
    category: 41
    label: 活動の調整
  procurement:
    category: 42
    label: 調達の手段

sequences:
  full_exam:
    - area: svs_new_service
    - area: info_technology
    - area: org_culture
