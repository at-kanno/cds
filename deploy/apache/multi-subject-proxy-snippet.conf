# Add these lines inside the existing <VirtualHost *:443> block
# (e.g. /etc/apache2/sites-available/000-default-le-ssl.conf)
#
# Do NOT set SCRIPT_NAME in cds.service / spanish4.service.
#
# Setup:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo apache2ctl configtest && sudo systemctl reload apache2

    # --- CDS (port 8080) ---
    RedirectMatch permanent ^/cds$ /cds/
    <Location /cds/>
        RequestHeader set X-Forwarded-Prefix "/cds"
    </Location>
    ProxyPreserveHost On
    ProxyPass /cds/ http://127.0.0.1:8080/
    ProxyPassReverse /cds/ http://127.0.0.1:8080/

    # --- SPANISH4 (port 8081) ---
    RedirectMatch permanent ^/spanish4$ /spanish4/
    <Location /spanish4/>
        RequestHeader set X-Forwarded-Prefix "/spanish4"
    </Location>
    ProxyPass /spanish4/ http://127.0.0.1:8081/
    ProxyPassReverse /spanish4/ http://127.0.0.1:8081/

    # --- TOEIC (port 8082) ---
    RedirectMatch permanent ^/toeic$ /toeic/
    <Location /toeic/>
        RequestHeader set X-Forwarded-Prefix "/toeic"
    </Location>
    ProxyPass /toeic/ http://127.0.0.1:8082/
    ProxyPassReverse /toeic/ http://127.0.0.1:8082/
