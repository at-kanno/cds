name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Missing secret EC2_HOST"
            missing=1
          fi
          if [ -z "$EC2_USER" ]; then
            echo "::error::Missing secret EC2_USER"
            missing=1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Missing secret EC2_SSH_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: APP_DIR,HEALTHCHECK_URL
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/ubuntu/cds}"
            HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://traveltokio.com/cds/api/health}"

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd backend
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt

            sudo systemctl restart cds
            sudo systemctl is-active cds
            curl -fsS "$HEALTHCHECK_URL"
            echo "Deploy completed successfully."
        env:
          APP_DIR: ${{ secrets.EC2_APP_PATH }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
