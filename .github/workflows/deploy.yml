name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy credentials
        env:
          EC2_HOST: ${{ secrets.EC2_HOST != '' && secrets.EC2_HOST || vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || vars.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Missing EC2_HOST (set as Secret or Variable)"
            missing=1
          fi
          if [ -z "$EC2_USER" ]; then
            echo "::error::Missing EC2_USER (set as Secret or Variable)"
            missing=1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Missing secret EC2_SSH_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "EC2_HOST / EC2_USER: Secrets or Variables tab"
            echo "EC2_SSH_KEY: Secrets tab only"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST != '' && secrets.EC2_HOST || vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_PATH != '' && secrets.EC2_APP_PATH || vars.EC2_APP_PATH }}"
            SPANISH4_DIR="${{ secrets.EC2_SPANISH4_PATH != '' && secrets.EC2_SPANISH4_PATH || vars.EC2_SPANISH4_PATH }}"
            HEALTHCHECK_URL="${{ secrets.HEALTHCHECK_URL != '' && secrets.HEALTHCHECK_URL || vars.HEALTHCHECK_URL }}"
            SPANISH4_HEALTHCHECK_URL="${{ secrets.SPANISH4_HEALTHCHECK_URL != '' && secrets.SPANISH4_HEALTHCHECK_URL || vars.SPANISH4_HEALTHCHECK_URL }}"
            export APP_DIR="${APP_DIR:-/home/ubuntu/cds}"
            export SPANISH4_DIR="${SPANISH4_DIR:-/home/ubuntu/spanish4}"
            export HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://traveltokio.com/cds/api/health}"
            export SPANISH4_HEALTHCHECK_URL="${SPANISH4_HEALTHCHECK_URL:-https://traveltokio.com/spanish4/api/health}"
            if [ -z "$APP_DIR" ]; then export APP_DIR=/home/ubuntu/cds; fi
            if [ -z "$SPANISH4_DIR" ]; then export SPANISH4_DIR=/home/ubuntu/spanish4; fi
            if [ -z "$HEALTHCHECK_URL" ]; then export HEALTHCHECK_URL=https://traveltokio.com/cds/api/health; fi
            if [ -z "$SPANISH4_HEALTHCHECK_URL" ]; then export SPANISH4_HEALTHCHECK_URL=https://traveltokio.com/spanish4/api/health; fi

            # Sync CDS first (bootstrap), then let deploy-backend.sh handle deps,
            # SPANISH4 sync (if present), service restarts, and health checks.
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            BACKUP_DIR="$(mktemp -d)"
            shopt -s nullglob
            for db in backend/exam.sqlite backend/exam-*.sqlite; do
              if [ -f "$db" ]; then
                cp -a "$db" "$BACKUP_DIR/"
              fi
            done
            for db in backend/exam.sqlite backend/exam-*.sqlite; do
              if git ls-files --error-unmatch "$db" >/dev/null 2>&1; then
                git update-index --no-skip-worktree "$db" 2>/dev/null || true
              fi
            done
            shopt -u nullglob
            git checkout -- backend/static/config.json 2>/dev/null || true
            git reset --hard origin/main
            shopt -s nullglob
            for db in "$BACKUP_DIR"/*; do
              if [ -f "$db" ]; then
                cp -a "$db" "backend/$(basename "$db")"
              fi
            done
            for db in backend/exam.sqlite backend/exam-*.sqlite; do
              if [ -f "$db" ] && git ls-files --error-unmatch "$db" >/dev/null 2>&1; then
                git update-index --skip-worktree "$db" 2>/dev/null || true
              fi
            done
            shopt -u nullglob
            rm -rf "$BACKUP_DIR"

            # CDS already synced; script will still sync SPANISH4 if the dir exists.
            SKIP_GIT_SYNC=1 bash deploy/deploy-backend.sh
