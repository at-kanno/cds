name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        env:
          APP_PROFILE: CDS
        run: python -c "from index import app; print('Flask app import OK')"

      - name: Run unit tests
        env:
          APP_PROFILE: CDS
        run: |
          set +e
          python -m unittest discover -s tests -t . -p 'test_*.py' -v > test-results.txt 2>&1
          status=$?
          set -e
          cat test-results.txt
          if [ "$status" -ne 0 ]; then
            python ../.github/scripts/annotate_unittest_failures.py test-results.txt
          fi
          exit "$status"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
